[build]
  command = "npm run db:generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"
  # RAZORPAY_KEY_ID and NEXT_PUBLIC_RAZORPAY_KEY_ID share the same value on
  # purpose — a Razorpay Key ID (unlike the Key Secret) is meant to be public
  # and ends up in the client bundle. Netlify's secret scanner matches by
  # value, not by which env var name is actually sensitive, and has flagged
  # this value under either name depending on the run — omit both.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_RAZORPAY_KEY_ID,RAZORPAY_KEY_ID"

[[plugins]]
  package = "@netlify/plugin-nextjs"
